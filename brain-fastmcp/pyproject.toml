[project]
name = "brain-fastmcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastmcp>=3,<5", "httpx2>=0.1", "uvicorn>=0.30", "python-dotenv>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_fastmcp"]
